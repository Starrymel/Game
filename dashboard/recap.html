<!doctype html>
<!-- Owner: D. Compact post-round recap, shown as an overlay inside the game: recap.html?match=ID -->
<!-- The detailed version lives at index.html (linked from the "Full analysis" button). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headiator Recap</title>
<link rel="stylesheet" href="recap.css">
</head>
<body>
<p id="msg" class="msg" role="status">Loading match&hellip;</p>

<main id="recap" class="recap" hidden>
  <header id="banner" class="banner"></header>
  <section id="hpbars" class="hpbars" aria-label="Health left"></section>
  <section id="cards" class="cards" aria-label="How the round went"></section>
  <p class="hint">Tap a card for more</p>

  <p id="summary" class="summary" role="status"></p>

  <div class="actions">
    <a id="full" class="btn" target="_blank" rel="noopener">Full analysis</a>
  </div>
</main>

<script src="recap.js"></script>
</body>
</html>
