<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Headiator</title>
<style>
  html, body { margin: 0; color: #dfebff; font: 14px system-ui; }
  html { min-height: 100%; background: #ffeaaa url('./assets/backgrounds/character-pattern-light.png') center / cover no-repeat fixed; }
  body { min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 12px; }
  #stage { width: min(1440px, 100%); height: auto; flex-shrink: 0; }
  #bio-debug, #presage-panel, #face-lab, #blink-lab { width: min(800px, 100%); box-sizing: border-box; background: #111c2e; padding: 16px; border: 1px solid #34445b; border-radius: 8px; }
  #bio-debug { font-family: "Lucida Console", "Courier New", monospace; font-weight: 700; border-radius: 16px; line-height: 1.5; }
  #bio-debug button, #bio-debug input, #bio-debug output { font-family: inherit; font-weight: 700; }
  #bio-debug fieldset { border-radius: 12px; }
  #bio-debug > summary { font-size: 16px; letter-spacing: 0.4px; }
  #presage-panel select { background: #1a2740; color: #dfebff; border: 1px solid #34445b; border-radius: 4px; padding: 6px 8px; margin: 8px 8px 8px 0; }
  #presage-panel p { font-size: 12px; color: #c7d6ea; }
  .game-controls { background: #111c2e; padding: 10px 16px; border-radius: 12px; box-sizing: border-box; max-width: 1440px; text-align: center; font: 700 14px/1.7 "Lucida Console", "Courier New", monospace; color: #dfebff; }
  summary { cursor: pointer; font-weight: bold; }
  #bio-sliders { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
  fieldset { flex: 1; min-width: 260px; border: 1px solid #34445b; }
  label { display: grid; grid-template-columns: 170px 1fr 44px; gap: 10px; align-items: center; margin: 6px 0; font-size: 12px; }
  fieldset label { grid-template-columns: 55px 1fr 38px; }
  input { min-width: 0; accent-color: #65e9b2; }
  button { padding: 8px 12px; background: #243e58; color: white; border: 1px solid #638bad; border-radius: 4px; cursor: pointer; }
  canvas { image-rendering: pixelated; box-shadow: 0 0 0 2px #333; }
  /* Warm, muted panels keep the character wallpaper visible without competing with it. */
  #bio-debug, #presage-panel, #face-lab, #blink-lab, .game-controls {
    background: #f5d0aa;
    color: #38251d;
    border: 1px solid #b87d50;
    box-shadow: 0 3px 10px rgba(67, 36, 16, 0.16);
  }
  #bio-debug fieldset, #face-lab fieldset, #blink-lab fieldset { background: #fbe1c6; border-color: #bd916b; }
  #presage-panel p { color: #51392a; }
  #presage-panel select {
    background: #fff0df; color: #38251d; border-color: #a77550;
  }
  #bio-debug button, #presage-panel button, #face-lab button, #blink-lab button, .game-controls button {
    background: #e9b787; color: #38251d; border-color: #a77550; font-weight: 700;
  }
  #bio-debug button:hover, #presage-panel button:hover, #face-lab button:hover, #blink-lab button:hover, .game-controls button:hover { background: #f1c79f; }
  #bio-debug input, #presage-panel input, #face-lab input, #blink-lab input, .game-controls input { accent-color: #925125; }
  .game-controls button { font: inherit; }
  #face-lab select, #blink-lab select { background: #fff0df; color: #38251d; border: 1px solid #a77550; border-radius: 4px; padding: 6px; }
</style>
</head>
<body>
<canvas id="stage" width="800" height="400"></canvas>
<div class="game-controls">P1: A/D · W jump · S block · F hit · G special | P2: arrows · K hit · L special | R restart</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
