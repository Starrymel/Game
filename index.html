<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Composure</title>
<style>
  html, body { margin: 0; color: #dfebff; font: 14px system-ui; }
  html { min-height: 100%; background: #0b0d12; }
  body { min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 12px; }
  #stage { width: min(960px, 100%); height: auto; flex-shrink: 0; }
  #bio-debug, #presage-panel { width: min(800px, 100%); box-sizing: border-box; background: #111c2e; padding: 16px; border: 1px solid #34445b; border-radius: 8px; }
  #bio-debug { font-family: "Lucida Console", "Courier New", monospace; font-weight: 700; border-radius: 16px; line-height: 1.5; }
  #bio-debug button, #bio-debug input, #bio-debug output { font-family: inherit; font-weight: 700; }
  #bio-debug fieldset { border-radius: 12px; }
  #bio-debug > summary { font-size: 16px; letter-spacing: 0.4px; }
  #presage-panel select { background: #1a2740; color: #dfebff; border: 1px solid #34445b; border-radius: 4px; padding: 6px 8px; margin: 8px 8px 8px 0; }
  #presage-panel p { font-size: 12px; color: #c7d6ea; }
  .game-controls { max-width: 960px; text-align: center; font: 700 14px/1.7 "Lucida Console", "Courier New", monospace; color: #dfebff; }
  summary { cursor: pointer; font-weight: bold; }
  #bio-sliders { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
  fieldset { flex: 1; min-width: 260px; border: 1px solid #34445b; }
  label { display: grid; grid-template-columns: 170px 1fr 44px; gap: 10px; align-items: center; margin: 6px 0; font-size: 12px; }
  fieldset label { grid-template-columns: 55px 1fr 38px; }
  input { min-width: 0; accent-color: #65e9b2; }
  button { padding: 8px 12px; background: #243e58; color: white; border: 1px solid #638bad; border-radius: 4px; cursor: pointer; }
  canvas { image-rendering: pixelated; box-shadow: 0 0 0 2px #333; }
</style>
</head>
<body>
<canvas id="stage" width="800" height="400"></canvas>
<div class="game-controls">P1: A/D · W jump · S block · F hit · G special | P2: arrows · K hit · L special | R restart</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
